# ============================================================================
######################### PUBLIC-DATA API - START ############################
# ============================================================================
# PUBLIC-DATA API  (land details for one khata number)
#
# URLs to call (plain GET, no body):
#   Readable page : http://localhost:8080/api/public-data/view
#   Clean JSON    : http://localhost:8080/api/public-data/parsed
#   Raw HTML      : http://localhost:8080/api/public-data/info
#
# Override any value from the URL (anything you leave out comes from below):
#   http://localhost:8080/api/public-data/view?khataNoIdselect=1006
#   http://localhost:8080/api/public-data/view?villageId=1019006&khataNoIdselect=1005
#
# FLOW
#   1. You call GET /api/public-data/view
#   2. PublicDataInfoController collects any query params you passed
#   3. PublicDataService fills the missing ones from this block
#   4. PublicDataClient sends  POST https://bhubharati.telangana.gov.in/getPublicDataInfo?<all params below>
#      (empty body), using the cookies, referer and user-agent from the "dharani:" block above
#   5. Portal replies with HTML; it is decoded as UTF-8 (so Telugu is not garbled)
#   6. LandDetailsParser reads the label/value pairs (Pattadar Details, Land Details)
#   7. /view -> LandDetailsHtmlRenderer builds the clean page
#      /parsed -> returns the pairs as JSON
#      /info -> returns the raw HTML
#
# WHERE THESE VALUES COME FROM IN THE BROWSER
#   Open the site, make a search, find the getPublicDataInfo request, copy its query values.
# =====================================================================

public-data:
  village-id: "1019006"
  flag-to-search: "surveynumber"
  search-data: "zNPu7s8elCxREc1fF6iihg=="
  flagval: "district"
  district: "10"
  mandal: "205"
  divi: ""
  khata-no-idselect: "1005"
  req-type: "Citizen"
  captcha: "rBqJxrSIQsQQI6HxsN1oeQ=="

# WHEN IT RETURNS "No land details found"
#   searchData / captcha / JSESSIONID are stale. Make a fresh search in the browser,
#   copy the new searchData and captcha into this block, copy the new JSESSIONID into
#   dharani.cookies, then restart the app.


# ============================================================================
######################### PUBLIC-DATA API - END ############################
# ============================================================================


