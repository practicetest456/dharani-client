# Configuration for generated document storage
app:
  storage:
    # Base directory for storing generated ROR 1-B PDF files.
    # Default: ./storage/ror1bs/generated-pdfs
    # Production: Set APP_STORAGE_ROOT to a persistent storage directory.
    ror1b: ${APP_STORAGE_ROOT:./storage}/ror1bs/generated/pdf

#=============================================================================
############# GENERATED Files(PDF/Json/...) STORAGE - START ##################
# ============================================================================



bhubharati:
  base-url: https://bhubharati.telangana.gov.in
  referer: https://bhubharati.telangana.gov.in/knowLandStatus

  connection:
    connect-timeout-ms: 10000
    response-timeout-seconds: 60

    # Supports large Bhubharati HTML responses.
    # Keep bounded to protect application memory.
    max-in-memory-size-mb: 50

    # Reuse connections instead of opening a new connection
    # for every Survey -> Khata request.
    max-connections: 50

  concurrency:

    # Maximum simultaneous Khata requests.
    # Increase carefully based on Bhubharati behavior.
    khata-requests: 10